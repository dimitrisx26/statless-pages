# Single-command standalone deploy (SQLite storage, zero config).
# Usage: docker compose up -d --build
# Then open http://localhost:8000

services:
  statless:
    build: .
    image: statless-pages:latest
    # The image runs non-root (uid 10001). On Linux, run as YOUR host uid so the
    # ./data bind-mount stays writable for SQLite: STATLESS_UID=$(id -u) docker compose up -d
    # On Docker Desktop (macOS/Windows) the default is fine.
    user: "${STATLESS_UID:-10001}:${STATLESS_GID:-10001}"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/statless.db
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SALT_ROTATE_HOURS: ${SALT_ROTATE_HOURS:-24}
      STATS_TOKEN: ${STATS_TOKEN:-}
      CONTROLLER_NAME: ${CONTROLLER_NAME:-}
      CONTROLLER_CONTACT: ${CONTROLLER_CONTACT:-}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-mailto:security@YOUR-DOMAIN.example}
      SECURITY_POLICY: ${SECURITY_POLICY:-}
      SECURITY_EXPIRES: ${SECURITY_EXPIRES:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-180}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FILTER_BOTS: ${FILTER_BOTS:-true}
      SERVER_SECRET: ${SERVER_SECRET:-}
      RATE_LIMIT: ${RATE_LIMIT:-120}
      VIEW_DEDUPE_MINUTES: ${VIEW_DEDUPE_MINUTES:-0}
      # Allow other iframe-based tools to frame /embed (replaces the Notion defaults):
      # EMBED_ALLOWED_ORIGINS: "https://docs.example.com,https://*.team.example.com"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # --- Optional: PostgreSQL instead of SQLite ---
  # 1. Uncomment the db service below.
  # 2. Set DATABASE_URL=postgresql+asyncpg://statless:statless@db:5432/statless
