name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check collector tests
      - name: Test
        run: uv run pytest -q
