name: Bug report
description: Something is broken, a count looks wrong, or an embed/badge misbehaves.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **redact** tokens, private URLs, and anything you don't want public.
        For setup or usage questions, use [Discussions](https://github.com/dimitrisx26/statless-pages/discussions) instead.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface is affected?
      options:
        - Notion embed (/embed)
        - Custom-site iframe (/embed)
        - Pixel (/pixel)
        - Heartbeat (/heartbeat)
        - Badge (/badge)
        - Stats API (/stats, /overview, /export)
        - Ingest, storage, or other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The action or request, the expected result, and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, or the exact request. Redact tokens and IPs.
      placeholder: |
        1. ...
        2. ...
        curl 'https://YOUR-HOST/pixel/my-doc.svg'
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Where is it embedded? (if applicable)
      placeholder: Notion / Obsidian Publish / GitHub README / Ghost / custom site
    validations:
      required: false
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Docker (single container)
        - Local (uv / uvicorn)
        - Behind a reverse proxy
        - Other
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / image tag / commit
      description: Container tag, release, or commit SHA you are running.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration (redacted)
      description: Which non-default settings are set (e.g. TRUST_PROXY, EMBED_ALLOWED_ORIGINS, RETENTION_DAYS, FILTER_BOTS)? Never paste secrets or STATS_TOKEN values.
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or response
      description: Server output around the event. Redact secrets.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: I removed secrets, tokens, and private URLs from this report.
          required: true
        - label: I am running the latest release or `main`.
          required: false
